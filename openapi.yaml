openapi: 3.1.0
info:
  title: ÇarşıHub API
  version: 0.5.0
  description: |
    Tüm hatalar `{"error":{"code","message","fields?","details?"}}` biçimindedir.
    Para tutarları kuruş cinsinden tam sayıdır (`*_kurus`).
    Korunan uçlar `Authorization: Bearer <access_token>` ister; yoksa 401, rol uygun değilse 403.
servers:
  - url: http://localhost:8080
tags:
  - name: platform
  - name: auth
  - name: admin
  - name: catalog
  - name: seller
  - name: cart
  - name: orders
  - name: payments
  - name: shipping
  - name: ops
  - name: coupons
paths:
  /health:
    get:
      tags: [platform]
      summary: Servis ve veritabanı sağlık durumu
      responses:
        "200":
          description: Servis ve veritabanı ayakta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Veritabanına ulaşılamıyor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /metrics:
    get:
      tags: [platform]
      summary: Prometheus formatında metrikler
      responses:
        "200":
          description: Metin biçiminde metrikler
          content:
            text/plain: {}

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: E-posta ve parolayla giriş
      description: Refresh token hem gövdede hem `carsihub_refresh` httpOnly çerezinde döner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_credentials` — e-posta ya da parola hatalı (bilinmeyen e-postayla aynı yanıt)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh token ile yeni oturum (token rotasyonu)
      description: |
        Token gövdeden ya da çerezden okunur. Her refresh token tek kullanımlıktır.
        İptal edilmiş bir token yeniden kullanılırsa oturum ailesinin tamamı iptal edilir (`token_reused`).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Yeni oturum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: "`unauthorized` (geçersiz/süresi dolmuş) ya da `token_reused`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Oturumu sonlandır (idempotent)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Oturum kapatıldı, çerez silindi }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Oturum sahibi
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Kullanıcı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: Kullanıcı listesi (yalnızca yönetici, keyset sayfalama)
      security: [{ bearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, description: Önceki sayfanın next_cursor değeri, schema: { type: string } }
      responses:
        "200":
          description: Sayfa
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
                  next_cursor: { type: string, description: Yoksa son sayfadır }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /api/v1/categories:
    get:
      tags: [catalog]
      summary: Kategoriler
      security: [{ bearer: [] }]
      responses:
        "200": { description: Kategori listesi }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/products:
    get:
      tags: [catalog]
      summary: Ürün listesi (en düşük fiyat, satılabilir stok; keyset)
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: Sayfa }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/products/{id}:
    get:
      tags: [catalog]
      summary: Ürün, varyantları ve her varyantın satıcı teklifleri
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Ürün }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/seller/products:
    post:
      tags: [seller]
      summary: Satıcı ürün + varyant + kendi teklifini (fiyat, stok) ekler
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProduct" }
      responses:
        "201": { description: Oluşturulan ürün }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`duplicate_sku`" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/seller/offers:
    get:
      tags: [seller]
      summary: Satıcının kendi teklifleri (stok, rezerve, satılabilir; keyset)
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: Sayfa }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/seller/offers/{id}/stock:
    put:
      tags: [seller]
      summary: Eldeki stoğu ayarla (tutulan miktarın altına inemez)
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_on_hand]
              properties: { stock_on_hand: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Güncel teklif }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`below_reserved`" }
  /api/v1/cart:
    get:
      tags: [cart]
      summary: Sepet; her kalemde `reserved` ve `reserved_until`
      security: [{ bearer: [] }]
      responses:
        "200": { description: Sepet }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/cart/items:
    post:
      tags: [cart]
      summary: Kalem ekle ya da adedini değiştir; stok RESERVATION_TTL boyunca tutulur
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Item" }
      responses:
        "200": { description: Güncel sepet }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InsufficientStock" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/cart/items/{id}:
    delete:
      tags: [cart]
      summary: Kalemi çıkar, stoğu bırak
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Güncel sepet }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/cart/checkout:
    post:
      tags: [cart]
      summary: Sepetten sipariş (satıcı başına alt sipariş); kısmi satış PARTIAL_FULFILLMENT'e göre
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201":
          description: Sipariş (stoğu yetmeyen kalemler `unavailable_items` içinde)
          content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } }
        "409": { description: "`insufficient_stock` ya da `cart_empty`" }
  /api/v1/orders:
    get:
      tags: [orders]
      summary: Müşterinin siparişleri (keyset)
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: Sayfa }
    post:
      tags: [orders]
      summary: Doğrudan sipariş ("hemen al")
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/Item" } }
      responses:
        "201":
          description: Sipariş
          content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } }
        "409": { $ref: "#/components/responses/InsufficientStock" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/orders/{id}:
    get:
      tags: [orders]
      summary: Sipariş ayrıntısı (müşteri yalnızca kendi siparişini; operasyon/yönetici hepsini)
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Sipariş
          content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Ödeme bekleyen siparişi iptal et; stok iade edilir
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: İptal edilmiş sipariş }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`invalid_state`" }

  /api/v1/payments/callback:
    post:
      tags: [payments]
      summary: Ödeme sağlayıcının sonuç bildirimi (webhook)
      description: |
        JWT değil HMAC-SHA256 imzasıyla yetkilendirilir (`X-Webhook-Timestamp`, `X-Webhook-Signature`;
        imza `ts + "." + gövde` üzerinden, 5 dk tolerans). Tekrar gelen callback etkisizdir (`outcome: duplicate`).
      security: [{ webhook: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id, status]
              properties:
                payment_id: { type: string, format: uuid }
                status: { type: string, enum: [succeeded, failed] }
                reason: { type: string }
      responses:
        "200":
          description: "`outcome`: paid | failed | refunding | duplicate"
        "401": { description: "`invalid_signature`" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/shipping/callback:
    post:
      tags: [shipping]
      summary: Kargo firmasının takip olayı (webhook, HMAC)
      description: "Aynı `event_id` ikinci kez gelirse `duplicate: true`. Durum yalnızca ileri gider."
      security: [{ webhook: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentEvent" }
      responses:
        "200": { description: "`{\"duplicate\": bool}`" }
        "401": { description: "`invalid_signature`" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/carrier/shipments/{tracking}/events:
    post:
      tags: [shipping]
      summary: Kargo entegrasyonu rolünün elle olay girişi
      security: [{ bearer: [] }]
      parameters:
        - { name: tracking, in: path, required: true, schema: { type: string } }
        - name: Idempotency-Key
          in: header
          required: true
          description: Olay kimliği; aynı anahtar ikinci kez gelirse olay tekrar sayılmaz.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [picked_up, in_transit, delivered] }
                occurred_at: { type: string, format: date-time }
      responses:
        "200": { description: "`{\"duplicate\": bool}`" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/shipments/{tracking}:
    get:
      tags: [shipping]
      summary: Kargo takibi (müşteri yalnızca kendi gönderisini)
      security: [{ bearer: [] }]
      parameters: [{ name: tracking, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Gönderi ve olay geçmişi
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracking_number: { type: string }
                  status: { type: string, enum: [requested, created, picked_up, in_transit, delivered, failed] }
                  sub_order_id: { type: string, format: uuid }
                  order_id: { type: string, format: uuid }
                  delivered_at: { type: string, format: date-time, nullable: true }
                  events:
                    type: array
                    items: { type: object, properties: { status: { type: string }, occurred_at: { type: string, format: date-time } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/seller/notifications:
    get:
      tags: [seller]
      summary: Satıcının bildirimleri (ödemesi alınan alt siparişler; keyset)
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: Sayfa }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ops/outbox:
    get:
      tags: [ops]
      summary: Outbox özeti (operasyon / yönetici)
      description: Bekleyen, yeniden denenen ve bırakılmış olaylar; en son 20 sorunlu olay ve hata mesajları.
      security: [{ bearer: [] }]
      responses:
        "200": { description: Özet }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ops/outbox/{id}/retry:
    post:
      tags: [ops]
      summary: Bırakılmış (dead) olayı yeniden kuyruğa al
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Kuyruğa alındı }
        "409": { description: "`invalid_state` — olay bırakılmış değil" }

  /api/v1/coupons:
    post:
      tags: [coupons]
      summary: Kupon oluştur (yönetici/operasyon → pazaryeri, satıcı → kendi mağazası)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCoupon" }
      responses:
        "201": { description: Kupon }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`duplicate_code`" }
        "422": { $ref: "#/components/responses/Validation" }
    get:
      tags: [coupons]
      summary: Kuponlar (satıcı yalnızca kendininkileri; keyset)
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: Sayfa }
  /api/v1/cart/coupons:
    post:
      tags: [cart]
      summary: Sepete kupon ekle
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        "200": { description: "Güncel sepet; `applied_coupons`, `rejected_coupons`, satır indirimleri" }
        "404": { description: "`coupon_not_found`" }
        "409": { description: "`too_many_coupons`" }
        "422": { description: "`coupon_expired` / `coupon_not_started`" }
  /api/v1/cart/coupons/{code}:
    delete:
      tags: [cart]
      summary: Kuponu sepetten çıkar
      security: [{ bearer: [] }]
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Güncel sepet }
  /api/v1/orders/{id}/refund-quote:
    post:
      tags: [orders]
      summary: Kısmi iade önizlemesi (kupon geri hesabıyla); bir şey değiştirmez
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [order_item_id, quantity]
                    properties:
                      order_item_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: İade hesabı
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund_kurus: { type: integer }
                  paid_before_kurus: { type: integer }
                  paid_after_kurus: { type: integer }
                  clawback_kurus: { type: integer, description: İade edilen kalemlerin ödenmiş payından kupon kaybı nedeniyle kesilen }
                  lost_coupons: { type: array, items: { type: string } }
                  by_seller: { type: object, additionalProperties: { type: object } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`invalid_state` — sipariş ödenmemiş" }
        "422": { $ref: "#/components/responses/Validation" }

components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Aynı anahtarla tekrar istek işlemi yeniden yapmaz, ilk yanıtı döner (`Idempotent-Replayed` başlığı). Farklı gövdeyle 422 `idempotency_key_reused`.
      schema: { type: string, maxLength: 200 }
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    webhook:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC-SHA256(secret, X-Webhook-Timestamp + "." + gövde), hex
  responses:
    NotFound:
      description: "`not_found`"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InsufficientStock:
      description: "`insufficient_stock` — `error.details.unavailable_items`: her kalem için istenen, satılabilir miktar ve neden"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: "`bad_request` — gövde geçerli JSON değil ya da bilinmeyen alan içeriyor"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: "`unauthorized` — token yok ya da geçersiz"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: "`forbidden` — rol bu işlem için yetkili değil"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Validation:
      description: "`validation_failed` — `fields` alan bazlı hataları içerir"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
            details: { type: object }
    Role:
      type: string
      enum: [customer, seller, operations, finance, carrier, admin]
    User:
      type: object
      required: [id, email, full_name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 72 }
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token: { type: string, description: Yoksa çerez kullanılır }
    Session:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Saniye }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    Item:
      type: object
      required: [offer_id, quantity]
      properties:
        offer_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 100 }
    CreateProduct:
      type: object
      required: [category_id, name, variants]
      properties:
        category_id: { type: integer }
        name: { type: string, maxLength: 300 }
        description: { type: string }
        attributes: { type: object, additionalProperties: { type: string } }
        variants:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [sku, price_kurus, stock]
            properties:
              sku: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$" }
              attributes: { type: object, additionalProperties: { type: string } }
              price_kurus: { type: integer, minimum: 1, description: Kuruş }
              stock: { type: integer, minimum: 0 }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending_payment, paid, cancelled, expired] }
        subtotal_kurus: { type: integer }
        discount_kurus: { type: integer }
        total_kurus: { type: integer }
        payment_deadline: { type: string, format: date-time }
        payment:
          type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [pending, requested, succeeded, failed, refund_requested, refunded, abandoned] }
            failure_reason: { type: string }
            callback_count: { type: integer }
        sub_orders:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              seller_id: { type: string, format: uuid }
              seller_name: { type: string }
              status: { type: string }
              total_kurus: { type: integer }
              items: { type: array, items: { type: object } }
              shipment:
                type: object
                properties:
                  tracking_number: { type: string }
                  status: { type: string }
        unavailable_items:
          type: array
          items:
            type: object
            properties:
              offer_id: { type: string }
              requested: { type: integer }
              available: { type: integer }
              reason: { type: string, enum: [insufficient_stock, offer_not_found] }
    ShipmentEvent:
      type: object
      required: [event_id, tracking_number, status]
      properties:
        event_id: { type: string }
        tracking_number: { type: string }
        status: { type: string, enum: [picked_up, in_transit, delivered] }
        occurred_at: { type: string, format: date-time }
    CreateCoupon:
      type: object
      required: [code, kind, value]
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9_-]{3,32}$", description: Büyük harfe çevrilir }
        kind: { type: string, enum: [percent, fixed] }
        value: { type: integer, description: "percent: baz puan (1000 = %10), fixed: kuruş" }
        max_discount_kurus: { type: integer, description: Yalnızca yüzde indirimde üst sınır }
        min_basket_kurus: { type: integer, description: Kuponun uygulanabildiği satırların indirimsiz toplamı }
        category_ids: { type: array, items: { type: integer } }
        stackable: { type: boolean, default: true }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        max_redemptions: { type: integer, minimum: 1 }
        per_user_limit: { type: integer, minimum: 1 }
