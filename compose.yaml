name: carsihub

x-backend: &backend
  build: ./backend
  image: carsihub-backend:local
  env_file: .env

services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host'a port açılmaz; yalnızca compose ağından erişilir.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["api"]
    ports:
      - "8080:8080"
    stop_grace_period: 25s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Süresi dolan sepet rezervasyonlarını ve ödenmeyen siparişleri süpürür.
  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/worker", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: carsihub-frontend:local
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

  # make verify — ayağa kalkmış sistem üzerinde uçtan uca doğrulama.
  verify:
    <<: *backend
    command: ["verify"]
    profiles: ["verify"]
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
