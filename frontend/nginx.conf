server {
    listen 8080;
    root /usr/share/nginx/html;

    # Tek sayfalık uygulama: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri /index.html;
    }

    # Vite dosya adlarına içerik özeti koyar; uzun önbellek güvenli.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
